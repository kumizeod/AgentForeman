[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforeman"
version = "0.3.0"
description = "Bounded, resumable multi-round experiment management driven by Codex"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["psutil>=5.9,<8"]

[project.optional-dependencies]
demo = ["numpy>=1.24,<3"]

[project.scripts]
foreman = "agentforeman.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentforeman = ["templates/moons/*"]
